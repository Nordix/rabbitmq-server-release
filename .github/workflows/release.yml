name: Release

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --fix-missing --no-install-recommends \
            build-essential \
            ca-certificates \
            debhelper \
            elinks \
            erlang \
            elixir \
            fakeroot \
            git \
            libfile-fcntllock-perl \
            mandoc \
            nsis \
            python3-lxml \
            python3-markdown \
            python3-simplejson \
            rpm \
            rsync \
            tofrodos \
            unzip \
            xmlto \
            xsltproc \
            zip \
            curl

      - name: Build artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory '*'
          git config --global url."https://github.com/".insteadOf git@github.com:
          VERSION="${RELEASE_TAG#v}"
          rm -rf deps .erlang.mk
          make source-dist \
            PROJECT_VERSION="$VERSION" \
            base_rmq_ref=v3.8.9 \
            dep_rabbit="git https://github.com/Nordix/rabbitmq-server.git $RELEASE_TAG" \
            dep_rabbitmq_management="git https://github.com/Nordix/rabbitmq-management.git $RELEASE_TAG" \
            dep_rabbitmq_federation_management="git https://github.com/Nordix/rabbitmq-federation-management.git $RELEASE_TAG" \
            dep_rabbitmq_amqp1_0="git https://github.com/Nordix/rabbitmq-amqp1.0-common.git $RELEASE_TAG"
          find PACKAGES/ -name "*.tar.xz" -print
          sha256sum PACKAGES/*.tar.xz > "PACKAGES/rabbitmq-server-${RELEASE_TAG}.tar.xz.sha256"

      - name: Publish to Artifactory
        uses: jfrog/setup-jfrog-cli@v4
        with:
          version: latest
        env:
          JF_URL: ${{ secrets.ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}

      - run: |
          jf rt upload \
            "PACKAGES/*" \
            "allies-erlang/rabbitmq-server/${{ github.ref_name }}/" \
            --build-name="rabbitmq-server" \
            --build-number="${{ github.run_number }}"

          jf rt build-publish rabbitmq-server ${{ github.run_number }}
