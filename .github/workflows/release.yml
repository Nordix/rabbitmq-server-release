name: Release

on:
  push:
    branches:
      - add-release-workflow

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --fix-missing --no-install-recommends \
            build-essential \
            ca-certificates \
            debhelper \
            elinks \
            erlang \
            elixir \
            fakeroot \
            git \
            libfile-fcntllock-perl \
            mandoc \
            nsis \
            python3-lxml \
            python3-markdown \
            python3-simplejson \
            rpm \
            rsync \
            tofrodos \
            unzip \
            xmlto \
            xsltproc \
            zip \
            curl

      - name: Build artifact
        env:
          RELEASE_TAG: ${{ github.ref_name == 'add-release-workflow' && 'v3.8.9-est' || github.ref_name }}
          current_rmq_ref: v3.8.9
          base_rmq_ref: v3.8.9
          dep_rabbit: git https://github.com/Nordix/rabbitmq-server.git v3.8.9-est
          dep_rabbitmq_management: git https://github.com/Nordix/rabbitmq-management.git v3.8.9-est
          dep_rabbitmq_federation_management: git https://github.com/Nordix/rabbitmq-federation-management.git v3.8.9-est
          dep_rabbitmq_amqp1_0: git https://github.com/Nordix/rabbitmq-amqp1.0-common.git v3.8.9-est
        run: |
          git config --global --add safe.directory '*'
          git config --global url."https://github.com/".insteadOf git@github.com:
          git config --global credential.helper ''
          VERSION="${RELEASE_TAG#v}"
          printf '#!/bin/bash\nif [[ "$*" == "local.hex --force" ]]; then\n  exec /usr/bin/mix archive.install --force https://repo.hex.pm/installs/1.12.0/hex-1.0.1.ez\nfi\nexec /usr/bin/mix "$@"\n' | sudo tee /usr/local/bin/mix > /dev/null
          sudo chmod +x /usr/local/bin/mix
          rm -rf deps .erlang.mk
          make source-dist PROJECT_VERSION="$VERSION" \
            dep_rabbit="git https://github.com/Nordix/rabbitmq-server.git v3.8.9-est" \
            dep_rabbitmq_management="git https://github.com/Nordix/rabbitmq-management.git v3.8.9-est" \
            dep_rabbitmq_federation_management="git https://github.com/Nordix/rabbitmq-federation-management.git v3.8.9-est" \
            dep_rabbitmq_amqp1_0="git https://github.com/Nordix/rabbitmq-amqp1.0-common.git v3.8.9-est"
          find PACKAGES/ -name "*.tar.xz" -print
          sha256sum PACKAGES/*.tar.xz > "PACKAGES/rabbitmq-server-${RELEASE_TAG}.tar.xz.sha256"

      - name: Publish to Artifactory
        uses: jfrog/setup-jfrog-cli@v4
        with:
          version: latest
        env:
          JF_URL: ${{ secrets.ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}

      - run: |
          jf rt upload \
            "PACKAGES/*" \
            "allies-erlang/rabbitmq-server/${{ github.ref_name }}/" \
            --build-name="rabbitmq-server" \
            --build-number="${{ github.run_number }}"

          jf rt build-publish rabbitmq-server ${{ github.run_number }}
