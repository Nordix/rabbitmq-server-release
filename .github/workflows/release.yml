name: Release

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --fix-missing --no-install-recommends \
            build-essential \
            ca-certificates \
            debhelper \
            elinks \
            erlang \
            elixir \
            fakeroot \
            git \
            libfile-fcntllock-perl \
            mandoc \
            nsis \
            python3-lxml \
            python3-markdown \
            python3-simplejson \
            rpm \
            rsync \
            tofrodos \
            unzip \
            xmlto \
            xsltproc \
            zip \
            curl

      - name: Build artifact
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory '*'
          git config --global url."https://github.com/".insteadOf git@github.com:
          git config --global credential.helper ''
          VERSION="${RELEASE_TAG#v}"
          # v3.8.9-est-1 -> v3.8.9 (upstream tag), also handles v3.8.9-est
          UPSTREAM_TAG="$(echo $RELEASE_TAG | sed 's/-est.*$//')"
          # v3.8.9-est-1 -> v3.8.9-est (Nordix branch), also handles v3.8.9-est
          NORDIX_BRANCH="$(echo $RELEASE_TAG | sed 's/-est-[0-9]*$/-est/')"
          export NORDIX_RELEASE_TAG="$NORDIX_BRANCH"
          export current_rmq_ref="$UPSTREAM_TAG"
          export base_rmq_ref="$UPSTREAM_TAG"
          export dep_amqp10_common="git https://github.com/Nordix/rabbitmq-amqp1.0-common.git $RELEASE_TAG"
          curl -L -o /tmp/hex-1.0.1.ez https://repo.hex.pm/installs/1.12.0/hex-1.0.1.ez
          printf '#!/bin/bash\nif [[ "$*" == "local.hex --force" ]]; then\n  exec /usr/bin/mix archive.install --force /tmp/hex-1.0.1.ez\nfi\nexec /usr/bin/mix "$@"\n' | sudo tee /usr/local/bin/mix > /dev/null
          sudo chmod +x /usr/local/bin/mix
          rm -rf deps .erlang.mk
          make source-dist PROJECT_VERSION="$VERSION"
          find PACKAGES/ -name "*.tar.xz" -print

      - name: Publish to Artifactory
        uses: jfrog/setup-jfrog-cli@v4
        with:
          version: latest

      - name: Upload to Artifactory
        env:
          JF_URL: ${{ secrets.ARTIFACTORY_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
        run: |
          jf rt upload \
            --url="$JF_URL" \
            --access-token="$JF_ACCESS_TOKEN" \
            --flat=true \
            "PACKAGES/*.tar.xz" \
            "allies-erlang/rabbitmq-server/${{ github.ref_name }}/" \
            --build-name="rabbitmq-server" \
            --build-number="${{ github.run_number }}"

          jf rt build-publish \
            --url="$JF_URL" \
            --access-token="$JF_ACCESS_TOKEN" \
            rabbitmq-server ${{ github.run_number }}
